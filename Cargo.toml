[package]
name = "redbook"
description = "CDDA CD digital audio as per RedBook"
categories = ["Command line utilities", "Multimedia", "Hardware support"]
keywords = ["ccda", "windows", "flac"]
authors = ["Mike Foster <https://github.com/MusicalNinjaDad>"]
homepage = "https://github.com/MusicalNinjaDad/redbook"
repository = "https://github.com/MusicalNinjaDad/redbook"
readme = "README.md"
license = "MIT"
edition = "2024"
version = "0.1.0"

[features]
# for integration testing - expected results correlating to tests/assets
test_fixtures = ["dep:serde_json"]

[dependencies]
cdtoc = "0.13.2"
clap = { version = "4.6.5", features = ["derive"] }
exit_safely = "0.3.1"
flacenc = { version = "0.5.1" }
metaflac = "0.2.8"
musicbrainz_rs = { version = "0.13.0", git = "https://github.com/RustyNova016/musicbrainz_rs", features = [
    "sync",
    "native_tls",
] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "native-tls",
    "json",
] }
serde_json = { version = "1.0", optional = true }
tabular = "0.2.0"
try_v2 = "0.10.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Cdrom",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System",
    "Win32_System_IO",
] }
zune-jpeg = "0.5.15"

[dev-dependencies]
rstest = "0.26.1"

[build-dependencies]
build_safely = "0.5.4"
clap = { version = "4.6.5", features = ["derive"] }
clap_builder = "4.6.5"
clap_complete = "4.6.8"
clap_mangen = "0.3.0"

[patch.crates-io]
api_bindium = { git = "https://github.com/RustyNova016/api_bindium" }

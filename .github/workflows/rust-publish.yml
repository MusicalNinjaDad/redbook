name: Publish to crates.io & github releases
concurrency: Crates.io

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-check:
    uses: ./.github/workflows/rust.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: install tools
      uses: taiki-e/install-action@v2.87.1
      with:
        tool: |
          jaq
          parse-changelog
    - id: version
      name: get version
      run: |
        v="$(jaq -cr .package.version Cargo.toml)"
        echo "version: $v"
        
        echo "version=$v" >> $GITHUB_OUTPUT
        echo "# version $v" >> $GITHUB_STEP_SUMMARY
    - id: changelog
      name: validate changelog
      run: | 
        echo "## Changelog entry" >> $GITHUB_STEP_SUMMARY
        echo "$(parse-changelog CHANGELOG.md ${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY

  binaries:
    needs:
      - quality-check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: create folder for package
        run: mkdir rip
      - name: install rust
        run: rustup install && rustup update && rustup target add x86_64-pc-windows-msvc
      - name: install build-tools
        uses: taiki-e/install-action@v2.86.6
        with:
          tool: cargo-xwin,cargo-about
      - name: build
        run: cargo xwin cache windows-msvc-sysroot && cargo xwin cache xwin && cargo xwin build --target x86_64-pc-windows-msvc --release
      - name: generate licenses file
        run: cargo about generate --output-file third-party-licenses.html about.hbs
      - name: create archive
        run: |
          cp LICENSE rip/
          cp third-party-licenses.html rip/
          cp README.md rip/
          cp target/x86_64-pc-windows-msvc/release/*.exe rip/
          zip -r rip.zip rip/*
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: rip.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          archive: false

  publish_lib:
    needs:
      - version
      - quality-check
      - binaries
    # quality check may be skipped via skip-check
    if: ${{ !(failure() || cancelled()) }}
    environment: crates.io
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    # Install manually as different crates may have custom toolchains defined
    - name: install rust
      run: rustup set profile default && rustup install
    # Use OIDC for updating existing crates
    - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 #v1.0.5
      id: auth
    - name: Publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run:
        cargo publish

  github_release:
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      attestations: write
      contents: write
    needs:
      - version
      - publish_lib
      - binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: windows
      - name: install tools
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: parse-changelog
      - name: publish release
        run: parse-changelog CHANGELOG.md ${{ needs.version.outputs.version }} | gh release create v${{ needs.version.outputs.version }} rip.zip --notes-file -

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/>
      <stop offset="0.5" stop-color="#c9d1dc"/>
      <stop offset="1" stop-color="#e8ecf2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd4ff"/>
      <stop offset="0.45" stop-color="#b39dff"/>
      <stop offset="0.75" stop-color="#ff9db0"/>
      <stop offset="1" stop-color="#7bf0c8"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0343c"/>
      <stop offset="1" stop-color="#a3141d"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f4ea"/>
      <stop offset="1" stop-color="#e8e3d2"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#12151b"/>

  <!-- CD behind the cover, visible through the diagonal cut -->
  <g>
    <circle cx="212" cy="52" r="82" fill="url(#disc)"/>
    <path d="M212 52 L282 20 A82 82 0 0 1 292 84 Z" fill="url(#sheen)" opacity="0.55"/>
    <circle cx="212" cy="52" r="68" fill="none" stroke="#9aa6b5" stroke-width="1.5" opacity="0.5"/>
    <circle cx="212" cy="52" r="55" fill="none" stroke="#9aa6b5" stroke-width="1.5" opacity="0.4"/>
    <circle cx="212" cy="52" r="20" fill="#dfe4ea"/>
    <circle cx="212" cy="52" r="12" fill="#12151b"/>
    <path d="M146 14 A82 82 0 0 1 184 -14" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- page edges: strip tied to the cover's right edge, top parallel to the cut -->
  <g>
    <path d="M216 140 L232 156 V196 Q232 216 212 216 H216 Z" fill="url(#pages)"/>
    <g stroke="#cfc7ae" stroke-width="1.4">
      <path d="M218 162 h12" fill="none"/>
      <path d="M218 180 h12" fill="none"/>
      <path d="M218 198 h10" fill="none"/>
    </g>
    <path d="M216 140 L232 156" fill="none" stroke="#b8b09a" stroke-width="2"/>
  </g>

  <!-- front cover: square bottom-right corner meets the page strip -->
  <path d="M116 40 H60 Q40 40 40 60 V196 Q40 216 60 216 H216 V140 Z" fill="url(#cover)"/>

  <!-- spine suggested by shadow lines near the left edge -->
  <path d="M62 46 V210" stroke="#6e0a11" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <path d="M74 46 V210" stroke="#6e0a11" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- cut edge highlight -->
  <path d="M116 40 L216 140" fill="none" stroke="#ffd9dc" stroke-width="3" opacity="0.6"/>

  <!-- embossed music note on the cover -->
  <g transform="translate(76 108) scale(1.9)">
    <path d="M0 20 v-32 l22 -6 v26" fill="none" stroke="#12151b" stroke-width="4.5" stroke-linejoin="round" opacity="0.85"/>
    <ellipse cx="-7" cy="20" rx="9" ry="7" fill="#12151b" opacity="0.85"/>
    <ellipse cx="15" cy="8" rx="9" ry="7" fill="#12151b" opacity="0.85"/>
  </g>
</svg>
